<!-- Replace the current .map-section contact-map-section block with this -->
<section class="map-section contact-map-section">
  <div class="container">
    <div class="map-card-large">
      <iframe
        class="serenity-map-iframe"
        title="Serenity Medical Center location map"
        src="https://www.google.com/maps?q=Serenity%20Medical%20Center%20Maison%20Damas%20Yaounde%20Cameroon&output=embed"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"

      <div class="map-card-copy">
        <span class="map-pin">⌖</span>
        <div>
          <span class="eyebrow">SERENITY LOCATION</span>
          <h3>Maison Damas · Chris Complex</h3>
          <p>1st floor · Yaoundé, Cameroon</p>
          <a class="btn btn-dark"

             rel="noopener"
             href="https://www.google.com/maps/search/?api=1&query=Serenity%20Medical%20Center%20Maison%20Damas%20Yaounde">
            Open in Google Maps →
          </a>

      </div>
    </div>
